name: Upscale wallpapers

on:
  push:
    branches: [main]
    paths:
      - "run-upscale.txt"

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Upscale and enhance wallpapers
        run: |
          mkdir -p upscaled
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          for source in sorted(Path(".").glob("IMG_20261103_*.jpg")):
              image = Image.open(source).convert("RGB")
              # Fit the image to 16:9 without stretching.
              target_ratio = 16 / 9
              width, height = image.size
              ratio = width / height
              if ratio > target_ratio:
                  new_width = round(height * target_ratio)
                  left = (width - new_width) // 2
                  image = image.crop((left, 0, left + new_width, height))
              elif ratio < target_ratio:
                  new_height = round(width / target_ratio)
                  top = (height - new_height) // 2
                  image = image.crop((0, top, width, top + new_height))

              image = image.resize((1920, 1080), Image.Resampling.LANCZOS)
              image = ImageEnhance.Contrast(image).enhance(1.03)
              image = ImageEnhance.Color(image).enhance(1.02)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.3, percent=115, threshold=3))
              image.save(Path("upscaled") / source.name, "JPEG", quality=95, optimize=True, subsampling=0)
              print(f"Processed {source.name}: {Image.open(source).size} -> 1920x1080")
          PY

      - name: Commit enhanced wallpapers
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add enhanced 1920x1080 wallpapers"
          file_pattern: "upscaled/*.jpg"
