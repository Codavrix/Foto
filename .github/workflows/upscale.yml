name: AI upscale wallpapers
on:
  push:
    branches: [main]
    paths:
      - "run-upscale.txt"
      - "scripts/ai_upscale.py"
permissions:
  contents: write
jobs:
  ai-upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU PyTorch and Real-ESRGAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2"
          python -m pip install torch==2.1.2+cpu torchvision==0.16.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install realesrgan==0.3.0 opencv-python-headless
      - name: Download model
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth', 'RealESRGAN_x4plus.pth')"
      - name: Run AI upscaler
        run: python scripts/ai_upscale.py
      - name: Commit AI outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add Real-ESRGAN AI wallpapers
          file_pattern: AI-1920x1080/*.jpg
